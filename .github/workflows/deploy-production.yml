name: Deploy Production

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samvio-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.SAMVIO_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SAMVIO_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy main to production
        env:
          DEPLOY_HOST: ${{ secrets.SAMVIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SAMVIO_DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/samvio/app && ./scripts/deploy-production.sh main && node --env-file=/etc/samvio/samvio.env ./scripts/cleanup-retention.mjs --dry-run && /usr/bin/bash ./scripts/activate-vipps-payments.sh'
